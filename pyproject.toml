[tool.poetry]
name = "agentgroup-backend"
version = "0.1.0"
description = "Backend service for agentgroup multi-agent discussion platform"
authors = ["Devin AI <158243242+devin-ai-integration[bot]@users.noreply.github.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.115.7"}
psycopg = {extras = ["binary"], version = "^3.2.4"}
python-dotenv = "^1.0.0"
pydantic = "^2.6.1"
openai = "^1.12.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
uvicorn = "^0.27.1"
redis = {extras = ["hiredis"], version = "^5.2.1"}
apscheduler = "^3.11.0"
pytest-asyncio = "^0.25.2"
pytest = "^8.3.4"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
